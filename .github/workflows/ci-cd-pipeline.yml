name: Production CI/CD Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, '3.2.7']
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  AWS_REGION: us-east-1
  ECR_REPOSITORY: shopizer-backend

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Generate Version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="v1.0.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Run Tests
        run: mvn verify

      - name: Build
        run: mvn package -DskipTests

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopizer-${{ steps.version.outputs.version }}.jar
          path: sm-shop/target/*.jar
          retention-days: 30

  push-to-infra:
    name: Push Artifacts to Infra Repo
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/3.2.7')
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: abhishek-gore/shopizer-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: shopizer-${{ needs.build-test.outputs.version }}.jar
          path: artifacts

      - name: Setup Git LFS
        run: |
          git lfs install

      - name: Copy artifacts
        run: |
          find artifacts -name "*.jar" -type f -exec cp {} infra/artifacts/backend/app.jar \;

      - name: Commit and push
        working-directory: infra
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add artifacts/backend/app.jar
          git commit -m "Update backend artifact from ${{ needs.build-test.outputs.version }}" || echo "No changes"
          git push

  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/3.2.7')
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-test.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-image
    environment:
      name: staging
      url: https://staging.shopizer.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        run: |
          aws eks update-kubeconfig --name shopizer-staging --region ${{ env.AWS_REGION }}
          kubectl set image deployment/shopizer-backend \
            shopizer-backend=${{ needs.build-test.outputs.version }} -n staging
          kubectl rollout status deployment/shopizer-backend -n staging

      - name: Smoke Test
        run: ./scripts/smoke-test.sh https://staging.shopizer.example.com

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-image, deploy-staging]
    environment:
      name: production
      url: https://shopizer.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Canary Deploy
        run: |
          aws eks update-kubeconfig --name shopizer-prod --region ${{ env.AWS_REGION }}
          kubectl argo rollouts set image shopizer-backend \
            shopizer-backend=${{ needs.build-test.outputs.version }} -n production
          kubectl argo rollouts status shopizer-backend -n production --watch

      - name: Smoke Test
        run: ./scripts/smoke-test.sh https://shopizer.example.com
