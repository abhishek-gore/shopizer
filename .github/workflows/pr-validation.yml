name: Pull Request Validation

on:
  pull_request:
    branches: [main, '3.2.7', 'feature/**']
    types: [opened, synchronize, reopened]

env:
  JAVA_VERSION: '17'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  validate:
    name: PR Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Validate Commit Messages
        run: |
          BASE_REF="${{ github.base_ref }}"
          git fetch origin "$BASE_REF"
          COMMITS=$(git log --format=%B "origin/$BASE_REF..HEAD")
          echo "Checking commits:"
          echo "$COMMITS"
          echo "$COMMITS" | grep -E '^(feat|fix|docs|test|chore|refactor|perf|ci|build|revert)(\(.+\))?: .+' || {
            echo "❌ Commit messages must follow Conventional Commits"
            exit 1
          }

      - name: Code Style Check
        run: mvn spotless:check || mvn checkstyle:check || echo "⚠️ No code style plugin configured"

      - name: Run Tests
        run: mvn clean test

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/target/surefire-reports/*.xml'

      - name: Comment PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ All PR checks passed!\n\n- Commit messages follow Conventional Commits\n- Code style validated\n- All tests passed'
            })
